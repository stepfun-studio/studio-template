  --weather-surface:#162d3b;--weather-text:#d9e8de;--weather-selected:#b9d8c5;--weather-selected-ink:#24473e;--weather-border:#3c535b;--weather-focus:#b5e8cb;

body[data-weather="sunny"]{--weather-surface:#edf1e7;--weather-text:#49645b;--weather-selected:#385d50;--weather-selected-ink:#f6f4df;--weather-border:#a4b9ae;--weather-focus:#234e3c}
body{background:#071323!important}
body>canvas{position:fixed;inset:0;z-index:1}
.weather-switch{position:fixed;z-index:2;right:max(var(--weather-inset),env(safe-area-inset-right));bottom:max(var(--weather-inset),env(safe-area-inset-bottom));display:inline-flex;align-items:center;min-height:var(--weather-height);padding:4px;gap:2px;border:1px solid var(--weather-border);border-radius:var(--weather-radius);background:var(--weather-surface);color:var(--weather-text);font:500 var(--weather-font)/1.2 -apple-system,BlinkMacSystemFont,"Hiragino Sans GB",sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color var(--weather-speed),border-color var(--weather-speed),transform var(--weather-speed) var(--weather-ease)}

.weather-switch:focus-visible{outline:2px solid var(--weather-focus);outline-offset:4px}
.weather-switch:active{transform:scale(.97)}

@media(prefers-reduced-motion:reduce){.weather-switch,.weather-choice{transition:none}}
