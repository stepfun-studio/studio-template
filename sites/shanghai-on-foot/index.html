    <noscript><main style="padding:2rem;max-width:40rem;margin:auto"><h1>上海路书 · 梧桐深处的一下午</h1><p>从武康大楼与对街取景点出发，依次到武康庭、巴金故居、罗密欧阳台、RAC Bar、wiggle wiggle、多抓鱼，沿乌鲁木齐中路走到淮海中路收尾。主线约2.2公里，慢逛预留3–4小时。</p><h2>怎么到达</h2><p>10／11号线交通大学站7号口，步行约5–10分钟到武康大楼；1／7号线常熟路站8号口，步行约5–10分钟到安福路东端、约15–20分钟到西段小店。时间为估计。</p><p>开启 JavaScript 即可旋转三维街区、点击建筑和阅读各站故事。</p></main></noscript>
