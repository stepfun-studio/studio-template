<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="icon" href="icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W0B7FV1BE7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-W0B7FV1BE7');
    </script>
</head>
<body>
  <a class="github-link" href="https://github.com/JonathanAspeling/pomodoro" target="_blank" rel="noopener noreferrer" aria-label="View source on GitHub">
    <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true">
      <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </svg>
  </a>
  <nav class="top-nav">
    <button id="menu-button" class="menu-button" aria-label="Menu">&#9776;</button>
  </nav>

  <main class="timer-stage">
    <div class="clock-face">
      <div class="outer-ring">
        <div id="time-circle" class="inner-circle">
          <canvas id="sweep-canvas" class="sweep-canvas"></canvas>
          <button id="play-button" class="play-button" aria-label="Play">&#9654;</button>
        </div>
      </div>
    </div>

    <div class="dot-selectors"></div>

    <div class="session-info-area">
      <div id="idle-label" class="session-label">
        <div class="mode-stepper" aria-label="Change mode">
          <button class="mode-step" id="mode-prev" aria-label="Previous mode">
            <svg viewBox="0 0 14 8" width="12" height="6" aria-hidden="true"><path d="M1 7 L7 1 L13 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="mode-step" id="mode-next" aria-label="Next mode">
            <svg viewBox="0 0 14 8" width="12" height="6" aria-hidden="true"><path d="M1 1 L7 7 L13 1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <span class="mode-text"><span id="session-type">POMODORO</span>&nbsp;<span id="session-duration">25 MIN</span></span>
      </div>
      <div id="running-display" class="running-display invisible">
        <p id="running-session-name" class="running-session-name">POMODORO</p>
        <p id="running-time" class="running-time">25:00</p>
      </div>
    </div>

    <button id="reset-button" class="reset-button invisible">Reset</button>
  </main>

  <div id="settings-page" class="settings-page hidden">
    <div class="settings-header">
      <button id="settings-back" class="settings-back">&#8249;</button>
    </div>
    <div class="settings-content">

      <section class="settings-section">
        <h4 class="settings-section-title">DURATIONS</h4>
        <div class="duration-tiles">
          <div class="duration-tile" data-key="focus">
            <span class="duration-value" id="tile-focus">25</span>
            <span class="duration-label">POMODORO</span>
          </div>
          <div class="duration-tile" data-key="short">
            <span class="duration-value" id="tile-short">5</span>
            <span class="duration-label">BREAK</span>
          </div>
          <div class="duration-tile" data-key="long">
            <span class="duration-value" id="tile-long">15</span>
            <span class="duration-label">LONG BREAK</span>
          </div>
        </div>
      </section>

      <section class="settings-section">
        <h4 class="settings-section-title">COLOR THEMES</h4>
        <div class="color-grid" id="color-grid"></div>
      </section>

      <section class="settings-section">
        <h4 class="settings-section-title">SOUND THEMES</h4>
        <div class="sound-tiles">
          <div class="sound-tile" data-sound="notification">
            <div class="sound-icon-circle" id="snd-notification-icon">&#10005;</div>
            <span class="sound-label">NOTIFICATION SOUND</span>
          </div>
          <div class="sound-tile" data-sound="alarm">
            <div class="sound-icon-circle" id="snd-alarm-icon">&#10003;</div>
            <span class="sound-label">ALARM SOUND</span>
          </div>
        </div>
      </section>

      <section class="settings-section">
        <h4 class="settings-section-title">OTHER PREFERENCES</h4>
        <div class="pref-number-tiles">
          <div class="pref-number-tile" data-pref="pomodorosUntilLongBreak" data-min="1" data-max="12">
            <span class="pref-number-value" id="pref-pomodorosUntilLongBreak">4</span>
            <span class="pref-number-label">POMODOROS UNTIL<br>LONG BREAK</span>
          </div>
          <div class="pref-number-tile" data-pref="dailyGoal" data-min="1" data-max="24">
            <span class="pref-number-value" id="pref-dailyGoal">8</span>
            <span class="pref-number-label">DAILY GOAL</span>
          </div>
        </div>
        <div class="toggle-tiles">
          <div class="toggle-tile" data-pref="autostartBreaks">
            <div class="toggle-opts">
              <button class="toggle-opt toggle-yes">&#10003;</button>
              <button class="toggle-opt toggle-no">&#10005;</button>
            </div>
            <span class="toggle-label">AUTOSTART BREAKS</span>
          </div>
          <div class="toggle-tile" data-pref="autostartPomodoros">
            <div class="toggle-opts">
              <button class="toggle-opt toggle-yes">&#10003;</button>
              <button class="toggle-opt toggle-no">&#10005;</button>
            </div>
            <span class="toggle-label">AUTOSTART POMODOROS</span>
          </div>
          <div class="toggle-tile" data-pref="showNotification">
            <div class="toggle-opts">
              <button class="toggle-opt toggle-yes">&#10003;</button>
              <button class="toggle-opt toggle-no">&#10005;</button>
            </div>
            <span class="toggle-label">SHOW NOTIFICATION</span>
          </div>
          <div class="toggle-tile" data-pref="tickingSound">
            <div class="toggle-opts">
              <button class="toggle-opt toggle-yes">&#10003;</button>
              <button class="toggle-opt toggle-no">&#10005;</button>
            </div>
            <span class="toggle-label">TICKING SOUND</span>
          </div>
        </div>
      </section>

    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
